<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Sanitized Framadate poll fixture</title>
</head>
<body>
    <!--
        Minimal public-safe fixture derived from Framadate's table interface.
        It deliberately contains no live URLs, external resources, forms,
        service identifiers, edit tokens, comments, totals, or real names.
    -->
    <div id="poll" class="poll flow">
        <table class="proposals-table">
            <thead>
                <tr>
                    <td class="proposals-table__sticky-cell"></td>
                    <th scope="col" title="Sun 27 Sept 2026 : 12h30">
                        <span class="proposal__day-week">Sun</span>
                        <span class="proposal__day-month">27</span>
                        <span class="proposal__month">Sept 2026</span>
                        <span class="proposal__label">12h30</span>
                    </th>
                    <th scope="col" title="Sun 4 Oct 2026 : 12h30">
                        <span class="proposal__day-week">Sun</span>
                        <span class="proposal__day-month">4</span>
                        <span class="proposal__month">Oct 2026</span>
                        <span class="proposal__label">12h30</span>
                    </th>
                    <th scope="col" title="Sun 11 Oct 2026 : 12h30">
                        <span class="proposal__day-week">Sun</span>
                        <span class="proposal__day-month">11</span>
                        <span class="proposal__month">Oct 2026</span>
                        <span class="proposal__label">12h30</span>
                    </th>
                    <th scope="col" title="Sun 18 Oct 2026 : 12h30">
                        <span class="proposal__day-week">Sun</span>
                        <span class="proposal__day-month">18</span>
                        <span class="proposal__month">Oct 2026</span>
                        <span class="proposal__label">12h30</span>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th class="proposals-table__sticky-cell" scope="row">
                        <div class="proposals-table__author">
                            Unanswered Player
                        </div>
                    </th>
                    <td class="text--center">
                        <span class="vote vote--yes">
                            <span class="sr-only">Yes</span>
                        </span>
                    </td>
                    <td class="text--center"></td>
                    <td class="text--center"></td>
                    <td class="text--center"></td>
                </tr>
                <tr>
                    <th class="proposals-table__sticky-cell" scope="row">
                        <div class="proposals-table__author">
                            Answered Player
                        </div>
                    </th>
                    <td class="text--center">
                        <span class="vote vote--no">
                            <span class="sr-only">No</span>
                        </span>
                    </td>
                    <td class="text--center">
                        <span class="vote vote--yes">
                            <span class="sr-only">Yes</span>
                        </span>
                    </td>
                    <td class="text--center">
                        <span class="vote vote--maybe">
                            <span class="sr-only">If needed</span>
                        </span>
                    </td>
                    <td class="text--center">
                        <span class="vote vote--yes">
                            <span class="sr-only">Yes</span>
                        </span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
